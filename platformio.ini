; PlatformIO Project Configuration pour LilyGO T-Embed CC1101
[platformio]
default_envs = t-embed-cc1101

[env:t-embed-cc1101]
; Basé sur ESP32 Arduino 2.0.10 (framework espressif32@3.5.0)
platform = espressif32@3.5.0
# Espressif ESP32-S3 via PlatformIO (core 2.0.10 - compatible ESPSomfy-RTS)
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

upload_speed = 921600
monitor_speed = 115200

build_flags = 
    -DT_EMBED_CC1101
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=1
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1

lib_deps = 
    ELECHOUSE/ELECHOUSE_CC1101_SRC_DRV@^1.0
    bblanchon/ArduinoJson@^7
    me-no-dev/AsyncTCP@^1.1.1
    me-no-dev/ESPAsyncWebServer@^3.0.0
    ottojo/AsyncPing@^1.0.4
    knolleary/PubSubClient@^2.8
    mathieucarbou/ESPAsyncWiFiManager@^2.0
